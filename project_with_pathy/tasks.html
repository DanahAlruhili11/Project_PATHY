<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f0f7ff; color: #1e3a8a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .app-container { background: transparent; width: 100%; max-width: 520px; padding: 35px; position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1.5px solid #dbeafe; padding-bottom: 15px; }
        h2 { color: #1e3a8a; font-size: 24px; font-weight: 700; }
        .stats-badge { background: #e0f2fe; color: #0284c7; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }

        .input-section { display: flex; gap: 10px; margin-bottom: 25px; }
        input { flex: 1; padding: 14px 18px; border: 1.5px solid #bfdbfe; border-radius: 14px; font-size: 14px; background: #ffffff; color: #1e3a8a; outline: none; transition: all 0.3s; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
        
        .add-btn { padding: 0 22px; background: #3b82f6; color: white; border: none; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.3s; }
        .add-btn:hover { background: #2563eb; }

        ul { list-style-type: none; max-height: 280px; overflow-y: auto; padding-right: 4px; }
        li { background: #ffffff; padding: 14px 16px; margin-bottom: 12px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #dbeafe; transition: all 0.2s; box-shadow: 0 2px 6px rgba(59, 130, 246, 0.04); }
        li:hover { border-color: #93c5fd; }
        
        .task-text { font-size: 14px; color: #1e3a8a; font-weight: 500; }
        .delete-btn { background: #fee2e2; color: #ef4444; border: none; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .delete-btn:hover { background: #ef4444; color: #fff; }

        .footer-nav { display: flex; justify-content: center; gap: 20px; margin-top: 25px; border-top: 1.5px solid #dbeafe; padding-top: 20px; }
        .footer-nav a { color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
        .footer-nav a:hover { color: #1d4ed8; }

        #toast {
            visibility: hidden;
            min-width: 260px;
            background-color: #1e3a8a;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 14px 18px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%) translateY(20px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #toast.show {
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>My Tasks</h2>
            <span id="taskCount" class="stats-badge">0 tasks</span>
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>

        <div class="footer-nav">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
        </div>
    </div>

    <div id="toast">Notification message</div>

    <script>
        let totalTasks = 0;

        function updateCounter() {
            const badge = document.getElementById('taskCount');
            badge.textContent = `${totalTasks} task${totalTasks === 1 ? '' : 's'}`;
        }

        function showNotification(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            
            if (type === 'success') {
                toast.style.background = '#10b981';
            } else if (type === 'error') {
                toast.style.background = '#ef4444';
            } else if (type === 'warning') {
                toast.style.background = '#f59e0b';
            }

            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();
            
            if (taskText === '') {
                showNotification('Please enter a task name first!', 'warning');
                return;
            }

            totalTasks++;
            updateCounter();

            const li = document.createElement('li');
            li.innerHTML = `
                <span class="task-text">${taskText}</span> 
                <button class="delete-btn" onclick="removeTask(this)">Delete</button>
            `;
            
            document.getElementById('taskList').appendChild(li);
            input.value = '';
            
            showNotification('✨ Task added successfully!', 'success');
        }

        function removeTask(button) {
            button.parentElement.style.opacity = '0';
            setTimeout(() => {
                button.parentElement.remove();
                totalTasks = Math.max(0, totalTasks - 1);
                updateCounter();
                showNotification('🗑️ Task removed', 'error');
            }, 200);
        }
    </script>
</body>
</html>
