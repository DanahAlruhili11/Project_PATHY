<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f0f7ff; color: #1e3a8a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .hero-card { background: transparent; width: 100%; max-width: 550px; padding: 50px 40px; text-align: center; }
        .badge { background: #e0f2fe; color: #0284c7; padding: 6px 16px; border-radius: 30px; font-size: 13px; font-weight: 600; display: inline-block; margin-bottom: 20px; }
        h1 { color: #1e3a8a; font-size: 32px; font-weight: 700; margin-bottom: 12px; }
        p { color: #60a5fa; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 14px 32px; background: #3b82f6; color: #fff; text-decoration: none; border-radius: 14px; font-weight: 600; font-size: 15px; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35); transition: all 0.3s ease; }
        .btn:hover { background: #2563eb; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="hero-card">
        <span class="badge">✨ Welcome to your workspace</span>
        <h1>Organize Your Daily Goals Effortlessly</h1>
        <p>A clean, cozy, and interactive space to manage your tasks, track your progress, and stay productive every single day.</p>
        <a href="login.html" class="btn">Get Started 🚀</a>
    </div>
</body>
</html>
